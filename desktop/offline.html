<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>Shortlisted</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px; line-height: 1.5; color: #111827; background: #f7f8fa;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%; max-width: 400px; padding: 32px; text-align: center;
        background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
        box-shadow: 0 6px 16px -4px rgba(16, 24, 40, 0.12), 0 2px 4px -2px rgba(16, 24, 40, 0.06);
      }
      svg { display: block; margin: 0 auto 16px; border-radius: 10px; }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
      p { margin: 0; color: #6b7280; }
      button {
        margin-top: 24px; width: 100%; padding: 10px 14px; border: 0; border-radius: 8px;
        font: inherit; font-weight: 600; color: #fff; background: #2563eb; cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3); }
      button:disabled { opacity: 0.7; cursor: default; }
      a[hidden] { display: none; }
      a { display: inline-block; margin-top: 16px; font-size: 13px; color: #2563eb; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <svg width="44" height="44" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1e20" /><stop offset="1" stop-color="#000" /></linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#bg)" />
        <g transform="translate(-14 -14)">
          <rect x="104" y="150" width="210" height="150" rx="34" fill="#fff" fill-opacity="0.42" transform="rotate(-8 209 225)" />
          <rect x="150" y="196" width="210" height="150" rx="34" fill="#fff" fill-opacity="0.68" transform="rotate(-3 255 271)" />
          <rect x="198" y="244" width="210" height="150" rx="34" fill="#fff" />
          <path d="M258 322 l26 26 l56 -58" fill="none" stroke="#000" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </svg>
      <h1 id="title">Can't reach Shortlisted</h1>
      <p id="text">Check your internet connection. Your applications are safe and will be here when you're back online.</p>
      <button id="retry" type="button">Try again</button>
      <a id="web" hidden>Open Shortlisted in your browser</a>
    </main>
    <script>
      const query = new URLSearchParams(location.search)
      // ?site=…: the site's address, passed in by main.js so it lives in one place.
      const site = query.get('site')
      if (site && site.startsWith('https://')) {
        const link = document.getElementById('web')
        link.href = site
        link.hidden = false
      }
      // ?moved=1: the site answered, but not with the app (the address may have changed).
      if (query.has('moved')) {
        document.getElementById('title').textContent = "Shortlisted couldn't be opened"
        document.getElementById('text').textContent =
          'The site may be updating. Try again in a minute. If this keeps happening, download the latest desktop app from the Shortlisted website.'
      }
      const button = document.getElementById('retry')
      const retry = () => {
        button.disabled = true
        button.textContent = 'Trying…'
        window.shortlistedDesktop?.retry()
        // If it fails again this page is simply loaded afresh; this covers a retry that never answers.
        setTimeout(() => { button.disabled = false; button.textContent = 'Try again' }, 8000)
      }
      button.addEventListener('click', retry)
      window.addEventListener('online', retry) // the connection came back: don't wait for a click
    </script>
  </body>
</html>
