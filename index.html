<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // A page kept from before a release can point at script files the release removed: the page then stays
      // blank (white). Load it again, fresh, once; the timestamp stops a loop if the files really are missing.
      addEventListener('error', function (e) {
        var el = e.target
        var src = el && (el.src || el.href)
        if (!src || !/\/assets\//.test(src)) return
        try {
          var last = Number(sessionStorage.getItem('stale-reload')) || 0
          if (Date.now() - last < 15000) return
          sessionStorage.setItem('stale-reload', String(Date.now()))
        } catch (_) {
          return
        }
        location.reload()
      }, true)

      // Dark theme, set before anything is drawn so the page never flashes white (see src/lib/theme.ts).
      try {
        var theme = localStorage.getItem('shortlisted-theme')
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (theme === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (_) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Shortlisted: track every job application in one place</title>
    <meta name="description" content="A free, private board for your job hunt. Track applications by status, get reminders for interviews and follow-ups, and see which platforms reply." />

    <!-- Link previews (LinkedIn, WhatsApp, Facebook, X). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shortlisted" />
    <meta property="og:title" content="Shortlisted: track every job application in one place" />
    <meta property="og:description" content="A free, private board for your job hunt. Reminders for interviews and follow-ups, a calendar, and stats on which platforms reply." />
    <meta property="og:url" content="https://kalharatennakoon.github.io/shortlisted/" />
    <meta property="og:image" content="https://kalharatennakoon.github.io/shortlisted/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shortlisted: a status board of job applications on a laptop and a phone" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shortlisted: track every job application in one place" />
    <meta name="twitter:description" content="A free, private board for your job hunt. Reminders, calendar and stats." />
    <meta name="twitter:image" content="https://kalharatennakoon.github.io/shortlisted/og-image.png" />
    <link rel="canonical" href="https://kalharatennakoon.github.io/shortlisted/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
